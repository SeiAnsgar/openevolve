max_iterations: 100
checkpoint_interval: 10
log_level: "INFO"


llm:
  api_base: "https://llm.scads.ai/v1"
  #primary_model: "zai-org/GLM-5.2-FP8"
  primary_model: "Qwen/Qwen3.8-27B"
  primary_model_weight: 1.0
  secondary_model: "openai/gpt-oss-120b"
  secondary_model_weight: 0.0
  temperature: 0.55
  top_p: 0.95
  max_tokens: 8192
  timeout: 180

prompt:
  system_message: |
    "You are optimizing `generate_mapping()`, which returns an `accelforge.Mapping` describing how a fixed workload is tiled and executed across a fixed hardware architecture's memory hierarchy. Only edit code inside EVOLVE-BLOCK-START/END; 
    keep the function signature and return statement unchanged.
    Mappings are built from `accelforge.frontend.mapping` nodes: `Storage(tensors, component)`,
    `Temporal(rank_variable, tile_shape)`, `Spatial(rank_variable, tile_shape, fanout)`,
    `Compute(einsum, component)`,
    and `Sequential`/`Nested` for grouping.

    Goal: minimize energy/latency (or combined_score) from AccelForge's cost model, while satisfying: 
    tile shapes for each rank variable must multiply to its full size (with a loop reducing it to 1), spatial usage must not exceed a component's fanout, and stored tensors must not exceed a memory's capacity. 
    Names (tensors, rank variables, components) must match the given architecture/workload exactly.
    An `InvalidMappingError` means a constraint above was violated — fix tile shapes, nesting, or placement per the message. Other exceptions mean malformed code — check names and types.

    Prefer mappings with strong data reuse at cheap/small memories, valid use of spatial parallelism, and small, targeted changes over full rewrites."


  num_top_programs: 2
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 35  #changed: (70->35) Larger population for more diversity
  archive_size: 15  #changed: (30->15)
  num_islands: 5
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.6  # Slightly lower to encourage exploration

# Evaluator configuration
evaluator:
  timeout: 180  # Extended timeout to allow for more complex optimization
  cascade_evaluation: false #changed: true -> false; a runtime warning suggested the change
  cascade_thresholds: [0.5, 0.8]
  parallel_evaluations: 2 #changed: 4->2 because of API backend rate limiting
  use_llm_feedback: true

# Evolution settings
diff_based_evolution: false
allow_full_rewrites: true
max_code_length: 2000