test_1:
  inputs: [workload: "resnet18.onnx", hardware: "amic.yaml"]
  opt_goal: latency(for openevo)

  OpenEvo:
    parameters: ["run with extracted baseline, included in runtime"]
      number_of_iterations: 20
      modell: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    metrics:
      time: [real: 7m52.524s, user: 23m51.367s]
      score: [energy: 5.60169e+10, latency: 1.64296328e+08]

    OpenEvo:
    parameters: ["run with extracted baseline, included in runtime", "a,b,c)"]
      number_of_iterations: 50
      modell: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    metrics:
      time: [real: 12m51.796s, user: 42m19.321s]
      score: [energy: 1.2743175656e+010, latency: 1.3302049e+07]
                                                               
    OpenEvo:
    parameters: ["run with extracted baseline, included in runtime, a,b,c)"]
      number_of_iterations: 100
      modell: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    metrics:
      time: [real: 2m30.207s, user: 5m37.245s]
      score: [energy: 6.874653309e+09, latency: 7.810371e+06]
  ZigZag:
    metrics:
      time: [real: 1m6.227, user: 1m7.031s]
      score: [energy: 1.86e+09, latency: 1.57e+07]

