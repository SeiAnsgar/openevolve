#-------------------------------------------------------------------------------
max_iterations: 100
checkpoint_interval: 10
log_level: "INFO"


# LLM configuration
#von claude vorgeschlagen
llm:
  api_base: "https://llm.scads.ai/v1"
  #primary_model: "zai-org/GLM-5.2-FP8"
  primary_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  primary_model_weight: 1.0
  secondary_model: "openai/gpt-oss-120b"
  secondary_model_weight: 0.0
  temperature: 0.55
  top_p: 0.95
  max_tokens: 8192
  timeout: 180

#backup
#llm:
  #provider: "ollama"            
  #primary_model: "qwen2.5-coder:latest"
  #primary_model_weight: 1.0 
  #secondary_model: "llama3.1"
  #secondary_model_weight: 0.0
  #api_base: "http://localhost:11434/v1"
  #temperature: 0.7
  #top_p: 0.95
  #max_tokens: 4096
  #timeout: 600


# Prompt configuration
#ideas what to include in promt:
#-model name
#hardware definition (could cause problems because hardware definition is long which could lead to too long promt.. test later)

prompt:
  system_message: |
    You are an expert in dataflow mapping optimization for DNN accelerators using the ZigZag framework (including CIM/CNM).

    The given hardware is tesla_npu_like.yaml provided by ZigZag, here the hardware definition:


    name: npu_like

    memories:
      rf_1B:
        size: 8
        r_cost: 0.01
        w_cost: 0.01
        area: 0
        latency: 1
        operands: [I2]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 8
            bandwidth_max: 8
            allocation: 
              - I2, tl
          - name: w_port_1
            type: write
            bandwidth_min: 8
            bandwidth_max: 8
            allocation: 
              - I2, fh
        served_dimensions: [D2, D3]

      rf_4B:
        size: 32
        r_cost: 0.022
        w_cost: 0.022
        area: 0
        latency: 1
        operands: [O]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, tl
          - name: r_port_2
            type: read
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, th
          - name: w_port_1
            type: write
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, fh
          - name: w_port_2
            type: write
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, fl
        served_dimensions: []

      sram_1KB_I:
        size: 8192
        r_cost: 4.78
        w_cost: 5.59
        area: 0
        latency: 1
        operands: [I1]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 64
            bandwidth_max: 256
            allocation: 
              - I1, tl
          - name: w_port_1
            type: write
            bandwidth_min: 64
            bandwidth_max: 256
            allocation: 
              - I1, fh
        served_dimensions: [D1, D2, D3]

      sram_1KB_W:
        size: 8192
        r_cost: 4.78
        w_cost: 5.59
        area: 0
        latency: 1
        operands: [I2]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 64
            bandwidth_max: 256
            allocation: 
              - I2, tl
          - name: w_port_1
            type: write
            bandwidth_min: 64
            bandwidth_max: 256
            allocation: 
              - I2, fh
        served_dimensions: [D1, D2, D3]

      sram_1MB_A:
        size: 8388608
        r_cost: 208.08
        w_cost: 189.2
        area: 0
        latency: 1
        operands: [I1, O]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 64
            bandwidth_max: 1024
            allocation: 
              - I1, tl
              - O, tl
              - O, th
          - name: w_port_1
            type: write
            bandwidth_min: 64
            bandwidth_max: 1024
            allocation: 
              - I1, fh
              - O, fh
              - O, fl
        served_dimensions: [D1, D2, D3]

      sram_1MB_W:
        size: 8388608
        r_cost: 208.08
        w_cost: 189.2
        area: 0
        latency: 1
        operands: [I2]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 64
            bandwidth_max: 1024
            allocation: 
              - I2, tl
          - name: w_port_1
            type: write
            bandwidth_min: 64
            bandwidth_max: 1024
            allocation: 
              - I2, fh
        served_dimensions: [D1, D2, D3]

      dram:
        size: 10000000000
        r_cost: 700
        w_cost: 750
        area: 0
        latency: 1
        operands: [I1, I2, O]
        ports:
          - name: rw_port_1
            type: read_write
            bandwidth_min: 64
            bandwidth_max: 64
            allocation: 
              - I1, fh
              - I1, tl
              - I2, fh
              - I2, tl
              - O, fh
              - O, tl
              - O, fl
              - O, th
        served_dimensions: [D1, D2, D3]

    operational_array:
      unit_energy: 0.04 # pJ
      unit_area: 1 # unit
      dimensions: [D1, D2, D3]
      sizes: [32, 32, 4]


    Improve the spatial loop mapping to produce a better mapping. 
    You can try to use a third dimension D3

    IMPORTANT: do NOT implement a temporal_ordering part and temporal_mapping part
    
  #IMPORTANT: do NOT implement a temporal_ordering part and temporal_mapping part


  num_top_programs: 2
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 35  #changed: (70->35) Larger population for more diversity
  archive_size: 15  #changed: (30->15)
  num_islands: 5
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.6  # Slightly lower to encourage exploration

# Evaluator configuration
evaluator:
  timeout: 180  # Extended timeout to allow for more complex optimization
  cascade_evaluation: false #changed: true -> false; a runtime warning suggested the change
  cascade_thresholds: [0.5, 0.8]
  parallel_evaluations: 2 #changed: 4->2 because of API backend rate limiting
  use_llm_feedback: true

# Evolution settings
diff_based_evolution: false
allow_full_rewrites: true
max_code_length: 2000