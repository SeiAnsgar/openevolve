#-------------------------------------------------------------------------------
max_iterations: 100
checkpoint_interval: 10
log_level: "INFO"


# LLM configuration
#von claude vorgeschlagen
llm:
  api_base: "https://llm.scads.ai/v1"
  #primary_model: "zai-org/GLM-5.2-FP8"
  primary_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  primary_model_weight: 1.0
  secondary_model: "openai/gpt-oss-120b"
  secondary_model_weight: 0.0
  temperature: 0.55
  top_p: 0.95
  max_tokens: 8192
  timeout: 180

#backup
#llm:
  #provider: "ollama"            
  #primary_model: "qwen2.5-coder:latest"
  #primary_model_weight: 1.0 
  #secondary_model: "llama3.1"
  #secondary_model_weight: 0.0
  #api_base: "http://localhost:11434/v1"
  #temperature: 0.7
  #top_p: 0.95
  #max_tokens: 4096
  #timeout: 600


# Prompt configuration
#ideas what to include in promt:
#-model name
#hardware definition (could cause problems because hardware definition is long which could lead to too long promt.. test later)

prompt:
  system_message: |
    You are an expert in dataflow mapping optimization for DNN accelerators using the ZigZag framework (including CIM/CNM).
    The given hardware is amic.yaml provided by ZigZag, here the hardware definition:
    name: aimc

    memories:
      cells:
        size: 8
        r_cost: 0
        w_cost: 0.095
        area: 0
        latency: 0
        operands: [I2]
        ports:
          - name: rw_port_1
            type: read_write
            bandwidth_min: 8
            bandwidth_max: 8
            allocation: 
              - I2, fh
              - I2, tl
        served_dimensions: [] # Fully unrolled over all multipliers

      rf_1B:
        size: 8
        r_cost: 0.021
        w_cost: 0.021
        area: 0
        latency: 1
        operands: [I1]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 8
            bandwidth_max: 8
            allocation: 
              - I1, tl
          - name: w_port_1
            type: write
            bandwidth_min: 8
            bandwidth_max: 8
            allocation: 
              - I1, fh
        served_dimensions: [D1]

      rf_2B:
        size: 16
        r_cost: 0.021
        w_cost: 0.021
        area: 0
        latency: 1
        operands: [O]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, tl
          - name: r_port_2
            type: read
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, th
          - name: w_port_1
            type: write
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, fh
          - name: w_port_2
            type: write
            bandwidth_min: 16
            bandwidth_max: 16
            allocation: 
              - O, fl
        served_dimensions: [D2]

      sram_256KB:
        size: 262144
        r_cost: 416.16
        w_cost: 378.4
        area: 0
        latency: 1
        operands: [I1, O]
        ports:
          - name: r_port_1
            type: read
            bandwidth_min: 64
            bandwidth_max: 512
            allocation: 
              - I1, tl
              - O, tl
              - O, th
          - name: w_port_1
            type: write
            bandwidth_min: 64
            bandwidth_max: 512
            allocation: 
              - I1, fh
              - O, fh
              - O, fl
        served_dimensions: [D1, D2]

      dram:
        size: 10000000000
        r_cost: 700
        w_cost: 750
        area: 0
        latency: 1
        operands: [I1, I2, O]
        ports:
          - name: rw_port_1
            type: read_write
            bandwidth_min: 64
            bandwidth_max: 64
            allocation: 
              - I1, fh
              - I1, tl
              - I2, fh
              - I2, tl
              - O, fh
              - O, tl
              - O, fl
              - O, th
        served_dimensions: [D1, D2]

    operational_array:
      is_imc: True
      imc_type: analog
      input_precision: [8, 8] # unit: bit
      bit_serial_precision: 2 # unit: bit
      adc_resolution: 8 # unit: bit
      dimensions: [D1, D2]
      sizes: [128, 128]


    The given workload is the resnet50.onnx model. 

    Improve the `generate_mapping` function to produce a better mapping. Optimize for:
    - Data reuse: keep high-reuse loops close to the compute array; minimize costly re-fetches from higher memory levels.
    - Loop order: innermost = highest reuse for the most memory-costly operand; outermost = lowest reuse.
    - Spatial unrolling: choose dimensions/factors that fully utilize the array (no underutilization), maximize reuse via parallel broadcast/accumulation, and leave a well-factorizable remainder.
    - Tiling granularity: consider splitting one large temporal loop into multiple smaller tiled loops across memory levels if it lowers energy-delay product.
    - CIM/CNM: minimize redundant row/column activations and writes; exploit in-memory accumulation where possible.
    - Goal: minimize latency reported by the evaluator. Use prior scores/errors to guide changes; make targeted changes and avoid repeating previously invalid mappings.
    You can try to expand the  Add, Pooling 
  #IMPORTANT: do NOT implement a temporal_ordering part and temporal_mapping part

#    Syntax hints for temporal ordering section:
#    - it has to be list type
#    - entries have to be [name, number] pairs

 #   Hard constraints (never violate):
 #   - Each loop dimension must be fully factorized: spatial factor x product of temporal factors == original size.
 #   - All factors must be exact integer divisors.
 #   - Spatial unroll factors must not exceed the hardware array size on that axis.
 #   - Keep the mapping dict schema unchanged (core_allocation, spatial_mapping, temporal_ordering, memory_operand_links).

    

#    Output format (strict):
#    - Return ONLY the modified `generate_mapping` function as raw Python code.
#    - Do NOT include comments, docstrings, print statements, or explanations anywhere in the code.
#    - Do NOT add extra variables, alternative mappings, helper functions, or unused code.
#    - The function must contain only the minimal code required to define and return the mapping.

  num_top_programs: 2
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 35  #(70->35) Larger population for more diversity
  archive_size: 15  #(30->15)
  num_islands: 5
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.6  # Slightly lower to encourage exploration

# Evaluator configuration
evaluator:
  timeout: 180  # Extended timeout to allow for more complex optimization
  cascade_evaluation: false #changed: true -> false;a runtime warning suggested the change
  cascade_thresholds: [0.5, 0.8]
  parallel_evaluations: 4
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: true
allow_full_rewrites: false  # Definitely allow full rewrites
max_code_length: 2000