# Prompt configuration
#ideas what to include in promt:
#-model name
#hardware definition (could cause problems because hardware definition is long which could lead to too long promt.. test later)

prompt:
  system_message: |
    You are an expert in dataflow mapping optimization for DNN accelerators using the ZigZag framework (including CIM/CNM).
    The given hardware is amic.yaml provided by ZigZag, can be found in zigzag repo tutorial1 folder.
    The given workload is the resnet18_frist_layer.onnx model.

    Improve the `generate_mapping` function to produce a better spatial + temporal loop mapping for a fixed layer and hardware. Optimize for:
    - Data reuse: keep high-reuse loops close to the compute array; minimize costly re-fetches from higher memory levels.
    - Loop order: innermost = highest reuse for the most memory-costly operand; outermost = lowest reuse.
    - Spatial unrolling: choose dimensions/factors that fully utilize the array (no underutilization), maximize reuse via parallel broadcast/accumulation, and leave a well-factorizable remainder.
    - Tiling granularity: consider splitting one large temporal loop into multiple smaller tiled loops across memory levels if it lowers energy-delay product.
    - CIM/CNM: minimize redundant row/column activations and writes; exploit in-memory accumulation where possible.
    - Goal: minimize energy-delay product (EDP) as reported by the evaluator. Use prior scores/errors to guide changes; make targeted changes and avoid repeating previously invalid mappings.
    IMPORTANT: do NOT implement a temporal_ordering part and temporal_mapping part

#    Syntax hints for temporal ordering section:
#    - it has to be list type
#    - entries have to be [name, number] pairs

 #   Hard constraints (never violate):
 #   - Each loop dimension must be fully factorized: spatial factor x product of temporal factors == original size.
 #   - All factors must be exact integer divisors.
 #   - Spatial unroll factors must not exceed the hardware array size on that axis.
 #   - Keep the mapping dict schema unchanged (core_allocation, spatial_mapping, temporal_ordering, memory_operand_links).

    

#    Output format (strict):
#    - Return ONLY the modified `generate_mapping` function as raw Python code.
#    - Do NOT include comments, docstrings, print statements, or explanations anywhere in the code.
#    - Do NOT add extra variables, alternative mappings, helper functions, or unused code.
#    - The function must contain only the minimal code required to define and return the mapping.

  num_top_programs: 2
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 70  # Larger population for more diversity
  archive_size: 30
  num_islands: 5
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.6  # Slightly lower to encourage exploration

# Evaluator configuration
evaluator:
  timeout: 180  # Extended timeout to allow for more complex optimization
  cascade_evaluation: false #changed: true -> false;a runtime warning suggested the change
  cascade_thresholds: [0.5, 0.8]
  parallel_evaluations: 4
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: false
allow_full_rewrites: true  # Definitely allow full rewrites
max_code_length: 2000