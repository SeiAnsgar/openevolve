test_1_energy:
    workload: "resnet18"
    hardware: "amic"
    opt_goal: "energy"

    OpenEvolve:
        configuration:
            number_of_iterations: 10
            LLM_backend: "Qwen/Qwen3.8-27B"
        metrics:
            energy: 5.75e+09
            latency: 5.56e+06
        time: "8m45s"
    OpenEvolve:
        configuration: 
            number_of_iterations: 50
            LLM_backend: "Qwen/Qwen3.8-27B"
        metrics:
            energy: 5.74e+09
            latency: 5.56e+06
        time: "56m23s"

    ZigZag:
    configuration:
        nb_spatial_mappings: "default"
    metrics:
            energy: 5.14e+09
            latency: 5.65e+06
        time: "3m14s"


